version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tracepoint-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./tracepoint.db
      - DEFAULT_TIMEZONE=Asia/Kolkata
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tracepoint-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
